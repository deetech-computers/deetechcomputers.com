name: Keep Render backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health
        run: curl -fsS --max-time 45 --retry 2 --retry-delay 5 --retry-all-errors https://deetechcomputers-com.onrender.com/api/health
