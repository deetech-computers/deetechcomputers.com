<input class="w-full bg-surface p-md rounded-lg border-none focus:ring-2 focus:ring-primary-container font-mono-data text-body-md" placeholder="5" type="number"/>
</div>

</div>
</div>
<button class="w-full bg-primary-container text-on-primary font-bold py-md rounded-xl active:scale-95 transition-transform flex items-center justify-center gap-sm" onclick="simulateGenerate()">
                    Generate Codes

<!-- Toast Notification (Hidden by default) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-on-surface text-surface py-md px-lg rounded-full font-label-md flex items-center gap-sm transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-[100]" id="toast">
<span class="material-symbols-outlined text-secondary-fixed">check_circle</span>
            Code copied to clipboard
        </div>
</div>
<script>
        function copyCode(code) {
            const toast = document.getElementById('toast');
            toast.style.transform = 'translate(-50%, -10px)';
            toast.style.opacity = '1';
            
            setTimeout(() => {
                toast.style.transform = 'translate(-50%, 20px)';
                toast.style.opacity = '0';
            }, 2000);
        }

        function simulateGenerate() {
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined">progress_activity</span> Generating...`;
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Done!`;
                btn.classList.replace('bg-primary-container', 'bg-secondary');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.replace('bg-secondary', 'bg-primary-container');
                    btn.disabled = false;
                }, 1500);
            }, 1000);
        }
    </script>
