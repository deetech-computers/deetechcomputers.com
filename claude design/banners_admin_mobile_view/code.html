<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BannerManager Pro - Admin Banners</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">

                    "inverse-primary": "#9ad4a0",

                    "surface-variant": "#d8e3fa",

                    "outline": "#71796f",
                    "surface-dim": "#cfdaf1",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",

                    "secondary-container": "#a6f5af",
                    "on-primary-container": "#87c08d",

            "fontFamily": {

                    "body-lg": ["Hanken Grotesk"],

<style>
        body { font-family: 'Hanken Grotesk', sans-serif; background-color: #f5f6f7; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; }
        .tab-active { position: relative; }
        .tab-active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background-color: #184f27; }
        .custom-shadow { box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.05); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex justify-center items-start min-h-screen">
<!-- Mobile Artboard Wrapper (390px) -->
<div class="w-[390px] bg-background min-h-screen relative overflow-x-hidden flex flex-col">
<!-- Top Bar (JSON Reference: TopNavBar) -->
<header class="bg-surface sticky top-0 z-50 flex items-center justify-between px-margin-mobile h-16 border-b border-outline-variant">
<div class="flex items-center gap-md">
<button aria-label="Menu" class="p-xs active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">menu</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Banners</h1>
</div>
<div class="flex items-center gap-sm">
<button aria-label="Refresh" class="p-xs active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant">refresh</span>
</button>
<button aria-label="Account" class="p-xs active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 p-margin-mobile space-y-lg">
<!-- Expandable Create Banner Section -->
<section class="bg-surface-container-lowest rounded-xl custom-shadow overflow-hidden border border-outline-variant" id="create-banner-section">
<div class="p-md flex items-center justify-between cursor-pointer" onclick="document.getElementById('expandable-content').classList.toggle('hidden')">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary">add_box</span>
<span class="font-headline-md text-[18px] text-primary">Create Banner</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
<div class="p-md pt-0 space-y-md" id="expandable-content">
<!-- Segmented Switcher -->
<div class="bg-surface-container-low p-xs rounded-lg flex items-center">
<button class="flex-1 py-sm px-md text-label-md font-label-md rounded-md bg-secondary-container text-on-secondary-container transition-all" id="mode-internal" onclick="toggleMode('internal')">
                            Internal Link
                        </button>
<button class="flex-1 py-sm px-md text-label-md font-label-md rounded-md text-on-surface-variant transition-all" id="mode-external" onclick="toggleMode('external')">
                            External URL
                        </button>
</div>
<!-- Fields -->
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider block">Banner Name</label>
<input class="w-full bg-surface-container-low border-none rounded-lg p-md text-body-md focus:ring-2 focus:ring-primary focus:bg-white transition-all" placeholder="e.g. Summer Sale 2024" type="text"/>
</div>
<div class="space-y-sm" id="field-destination">
<label class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider block">Internal Route</label>
<select class="w-full bg-surface-container-low border-none rounded-lg p-md text-body-md focus:ring-2 focus:ring-primary focus:bg-white transition-all">
<option>Homepage - Tech Hardware</option>
<option>Laptops - Enterprise</option>
<option>Special Offers</option>
</select>
</div>
<div class="space-y-sm hidden" id="field-url">
<label class="text-label-md font-label-md text-on-surface-variant uppercase tracking-wider block">Destination URL</label>
<input class="w-full bg-surface-container-low border-none rounded-lg p-md text-body-md focus:ring-2 focus:ring-primary focus:bg-white transition-all" placeholder="https://..." type="url"/>
</div>
<button class="w-full bg-primary-container text-white font-headline-md text-[16px] py-md rounded-xl hover:opacity-90 active:scale-[0.98] transition-all shadow-md">
                        Create Banner
                    </button>
</div>
</section>
<!-- Banner List Header -->
<div class="flex items-center justify-between">
<h2 class="text-headline-md text-[20px] text-primary">Active Banners</h2>
<span class="text-label-md bg-secondary-container px-sm py-xs rounded-full text-on-secondary-container">3 Active</span>
</div>
<!-- Banner Card 1 -->
<article class="bg-white rounded-xl overflow-hidden custom-shadow border border-outline-variant flex flex-col group">
<div class="relative aspect-[16/9]">
<img class="w-full h-full object-cover" data-alt="A high-end professional banner showing sleek enterprise-grade server hardware in a data center with soft green ambient lighting. The visual is polished and corporate, featuring deep forest green accents and high-key metallic surfaces. The composition follows professional hardware photography standards for a premium tech brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBy9IGDGNejolib95mYbvtZ04X7BjPIXVxNB-DW5MahBMkz5ohrF-_OShoJxK3XyvUirGQw8A5lSa_ousPdPwLNb5EpZa1sIvqqh_EvHJ9DapxnUtQmSI0QojykP0qiR6vOcyDcEcD7w4gEPcJAZGZY-GQELReDCMD5C5ajYqhpvyWK8-nxjNUZC3DqdHxWk89W323jGZTxkYKm9OpJOOhH8od5Zo-wVcuzAsljt2ocbAy-P3TH-rPymakalMCpGojrSYbwHdXoFwg"/>
<div class="absolute top-md left-md bg-primary/80 backdrop-blur-md px-sm py-xs rounded-md">
<span class="font-mono-data text-mono-data text-white">ORDER: 01</span>
</div>
</div>
<div class="p-md space-y-sm">
<div class="flex justify-between items-start">
<div>
<h3 class="font-headline-md text-[18px] text-on-background">Enterprise Servers</h3>
<p class="text-body-sm text-on-surface-variant">Route: /hardware/servers</p>
</div>
<span class="bg-on-secondary-container/10 text-on-secondary-container text-label-md px-sm py-xs rounded-md">Success</span>
</div>
<div class="flex gap-sm pt-sm border-t border-outline-variant">
<button class="flex-1 flex items-center justify-center gap-xs py-sm border border-secondary text-secondary rounded-lg font-label-md active:bg-secondary/5 transition-colors">
<span class="material-symbols-outlined text-[18px]">edit</span> Edit
                        </button>
<button class="flex-1 flex items-center justify-center gap-xs py-sm border border-error text-error rounded-lg font-label-md active:bg-error/5 transition-colors">
<span class="material-symbols-outlined text-[18px]">delete</span> Delete
                        </button>
</div>
</div>
</article>
<!-- Banner Card 2 -->
<article class="bg-white rounded-xl overflow-hidden custom-shadow border border-outline-variant flex flex-col group">
<div class="relative aspect-[16/9]">
<img class="w-full h-full object-cover" data-alt="A creative marketing banner for a laptops sale, featuring high-end productivity laptops floating elegantly against a minimalist studio background. The lighting is bright and clean with soft shadows, incorporating corporate forest green design elements. The aesthetic is modern, tech-focused, and exudes institutional rigor and reliability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDfEbbfijwBOKOKGFs9jpi65zWcspOLqKcKVPvXn0Lic-j3jGH9Ss8dOlEIE0tBmU4WHIYd-9ksvU-VKRxOyn6cPsANbylT7sLsk1Y_3hTh9N_KNvj69PJ4qSaWeo1LZ2U_ge2CxHW6b2eahQPiBe-XwGjWkq4Dec5L23toWx050skmhxJXOBNbKmMqWgsrwOI-h20dQElBFgnFCd3hEUQBQkLmaWQifDKe7a0xdcBwc5f9Jk0RObg1R8PMKou2yjVJycnRKSmlf2Q"/>
<div class="absolute top-md left-md bg-primary/80 backdrop-blur-md px-sm py-xs rounded-md">
<span class="font-mono-data text-mono-data text-white">ORDER: 02</span>
</div>
</div>
<div class="p-md space-y-sm">
<div class="flex justify-between items-start">
<div>
<h3 class="font-headline-md text-[18px] text-on-background">Laptops Promotion</h3>
<p class="text-body-sm text-on-surface-variant">URL: https://deetech.com.gh/laptops</p>
</div>
<span class="bg-on-secondary-container/10 text-on-secondary-container text-label-md px-sm py-xs rounded-md">Success</span>
</div>
<div class="flex gap-sm pt-sm border-t border-outline-variant">
<button class="flex-1 flex items-center justify-center gap-xs py-sm border border-secondary text-secondary rounded-lg font-label-md active:bg-secondary/5 transition-colors">
<span class="material-symbols-outlined text-[18px]">edit</span> Edit
                        </button>
<button class="flex-1 flex items-center justify-center gap-xs py-sm border border-error text-error rounded-lg font-label-md active:bg-error/5 transition-colors">
<span class="material-symbols-outlined text-[18px]">delete</span> Delete
                        </button>
</div>
</div>
</article>
<!-- Banner Card 3 (Empty State/Draft) -->
<article class="bg-white rounded-xl overflow-hidden custom-shadow border border-outline-variant flex flex-col opacity-80">
<div class="relative aspect-[16/9] bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-[48px] text-outline-variant">image</span>
<div class="absolute top-md left-md bg-primary/50 backdrop-blur-md px-sm py-xs rounded-md">
<span class="font-mono-data text-mono-data text-white">ORDER: 03</span>
</div>
</div>
<div class="p-md space-y-sm">
<div class="flex justify-between items-start">
<div>
<h3 class="font-headline-md text-[18px] text-on-background">New Arrivals Draft</h3>
<p class="text-body-sm text-on-surface-variant">Pending image upload...</p>
</div>
<span class="bg-tertiary-container/20 text-on-tertiary-fixed-variant text-label-md px-sm py-xs rounded-md">Draft</span>
</div>
<div class="flex gap-sm pt-sm border-t border-outline-variant">
<button class="flex-1 flex items-center justify-center gap-xs py-sm border border-secondary text-secondary rounded-lg font-label-md active:bg-secondary/5 transition-colors">
<span class="material-symbols-outlined text-[18px]">edit</span> Edit
                        </button>
<button class="flex-1 flex items-center justify-center gap-xs py-sm border border-error text-error rounded-lg font-label-md active:bg-error/5 transition-colors">
<span class="material-symbols-outlined text-[18px]">delete</span> Delete
                        </button>
</div>
</div>
</article>
</main>
<!-- Fab (Contextual Rule: Primary Purpose) -->
<button class="fixed bottom-lg right-lg w-14 h-14 bg-primary text-white rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-transform z-50">
<span class="material-symbols-outlined text-[32px]">add</span>
</button>
</div>
<script>
        function toggleMode(mode) {
            const btnInternal = document.getElementById('mode-internal');
            const btnExternal = document.getElementById('mode-external');
            const fieldDestination = document.getElementById('field-destination');
            const fieldUrl = document.getElementById('field-url');

            if (mode === 'internal') {
                btnInternal.classList.add('bg-secondary-container', 'text-on-secondary-container');
                btnInternal.classList.remove('text-on-surface-variant');
                btnExternal.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                btnExternal.classList.add('text-on-surface-variant');
                
                fieldDestination.classList.remove('hidden');
                fieldUrl.classList.add('hidden');
            } else {
                btnExternal.classList.add('bg-secondary-container', 'text-on-secondary-container');
                btnExternal.classList.remove('text-on-surface-variant');
                btnInternal.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                btnInternal.classList.add('text-on-surface-variant');
                
                fieldDestination.classList.add('hidden');
                fieldUrl.classList.remove('hidden');
            }
        }

        // Lightweight interaction for button scales
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => btn.classList.add('scale-95'));
            btn.addEventListener('touchend', () => btn.classList.remove('scale-95'));
        });
    </script>
</body></html>
